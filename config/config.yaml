ollama:
  base_url: http://localhost:11434
  model: llama3.2          # change to mistral, phi3, gemma2 etc.
  temperature: 0.1

embeddings:
  # runs locally via sentence-transformers, no API key needed
  model: all-MiniLM-L6-v2

retrieval:
  top_k: 4
  chunk_size: 500
  chunk_overlap: 50

storage:
  vector_store_path: .vectorstore

api:
  host: 0.0.0.0
  port: 8000
